<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Arial, sans-serif">
  <rect width="1040" height="660" fill="#ffffff"/>
  <text x="520" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a2330">Local AI: Organization, Production</text>
  <text x="520" y="72" text-anchor="middle" font-size="15" fill="#5f6b7a">On-prem or private cloud. Data and models stay in-house.</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5f6b7a"/>
    </marker>
  </defs>

  <!-- org boundary -->
  <rect x="40" y="100" width="960" height="500" rx="14" fill="#f5f7fa" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="64" y="128" font-size="15" font-weight="bold" fill="#486581">Organization infrastructure: no external API</text>

  <!-- users -->
  <rect x="70" y="300" width="140" height="90" rx="10" fill="#e6f1fb" stroke="#378add" stroke-width="2"/>
  <text x="140" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">Staff users</text>
  <text x="140" y="357" text-anchor="middle" font-size="12" fill="#185fa5">internal network</text>
  <text x="140" y="375" text-anchor="middle" font-size="12" fill="#185fa5">SSO login</text>

  <!-- harness / app tier -->
  <rect x="270" y="285" width="180" height="120" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="2"/>
  <text x="360" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c3489">Open WebUI</text>
  <text x="360" y="344" text-anchor="middle" font-size="12" fill="#534ab7">multi-user harness</text>
  <text x="360" y="362" text-anchor="middle" font-size="12" fill="#534ab7">auth · RBAC</text>
  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#534ab7">per-user identity</text>

  <!-- GPU inference -->
  <rect x="520" y="150" width="220" height="130" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="2"/>
  <text x="630" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">GPU inference server(s)</text>
  <text x="630" y="208" text-anchor="middle" font-size="12" fill="#0f6e56">vLLM / Ollama</text>
  <text x="630" y="226" text-anchor="middle" font-size="12" fill="#0f6e56">14B–70B, quantized</text>
  <text x="630" y="244" text-anchor="middle" font-size="12" fill="#0f6e56">batching · load balanced</text>
  <text x="630" y="262" text-anchor="middle" font-size="12" fill="#1d9e75">optional fine-tuning</text>

  <!-- tool / mcp servers -->
  <rect x="520" y="320" width="220" height="110" rx="10" fill="#faeeda" stroke="#854f0b" stroke-width="2"/>
  <text x="630" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#633806">Tool / MCP servers</text>
  <text x="630" y="377" text-anchor="middle" font-size="12" fill="#854f0b">semantic layer · retrieval</text>
  <text x="630" y="395" text-anchor="middle" font-size="12" fill="#854f0b">validation · guardrails</text>
  <text x="630" y="413" text-anchor="middle" font-size="12" fill="#854f0b">publish to BI</text>

  <!-- data tier -->
  <rect x="800" y="150" width="170" height="130" rx="10" fill="#fbeaf0" stroke="#993556" stroke-width="2"/>
  <text x="885" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#72243e">Data tier</text>
  <text x="885" y="208" text-anchor="middle" font-size="12" fill="#993556">Postgres /</text>
  <text x="885" y="226" text-anchor="middle" font-size="12" fill="#993556">warehouse</text>
  <text x="885" y="248" text-anchor="middle" font-size="12" fill="#993556">governed schema</text>

  <!-- BI -->
  <rect x="800" y="320" width="170" height="110" rx="10" fill="#e6f1fb" stroke="#185fa5" stroke-width="2"/>
  <text x="885" y="355" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c447c">BI (Metabase)</text>
  <text x="885" y="377" text-anchor="middle" font-size="12" fill="#185fa5">dashboards</text>
  <text x="885" y="395" text-anchor="middle" font-size="12" fill="#185fa5">charts</text>

  <!-- ops bar -->
  <rect x="270" y="470" width="700" height="70" rx="10" fill="#f1efe8" stroke="#888780" stroke-width="2"/>
  <text x="620" y="500" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">Operations</text>
  <text x="620" y="523" text-anchor="middle" font-size="12" fill="#5f5e5a">monitoring · logging · backups · patching · 24/7 uptime · cooling &amp; power · specialist staff</text>

  <!-- arrows -->
  <line x1="210" y1="345" x2="266" y2="345" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="450" y1="320" x2="516" y2="230" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="452" y="262" font-size="11" fill="#5f6b7a">calls model</text>
  <line x1="450" y1="355" x2="516" y2="370" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="452" y="345" font-size="11" fill="#5f6b7a">calls tools</text>
  <line x1="740" y1="225" x2="796" y2="220" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="740" y1="375" x2="796" y2="375" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="700" y1="320" x2="860" y2="282" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arr2)" stroke-dasharray="4 4"/>

  <text x="520" y="578" text-anchor="middle" font-size="13" fill="#486581">All open source · deployment (and optional adaptation) sovereignty · the engineering layer is what makes it work</text>
</svg>
