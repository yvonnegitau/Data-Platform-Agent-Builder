
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'data_platform_f1'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'data_platform_f1'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]



clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  data_platform_f1:
    staging:
      +materialized: table
      +schema: f1_bronze_staging
      +tags: ["bronze","staging"]
      +pre-hook: "{{ dbt_utils.log_info('Running pre-hook for staging models') }}"
      +post-hook: "{{ dbt_utils.log_info('Running post-hook for staging models') }}"
      +meta:
        owner: "data_team"
        description: "Staging models for F1 data"
      # +contract:
      #   enforced: true
    silver: # Silver layer, built directly in Postgres (f1_silver)
      dims:
        +materialized: table
        +schema: f1_silver
        +tags: ["silver","dimension"]
        +pre-hook: "{{ dbt_utils.log_info('Running pre-hook for silver dimensions') }}"
        +post-hook: "{{ dbt_utils.log_info('Running post-hook for silver dimensions') }}"
        +meta:
          owner: "data_team"
          description: "Silver dimension models for F1 data"
      facts:
        +materialized: table
        +schema: f1_silver
        +tags: ["silver","fact"]
        +pre-hook: "{{ dbt_utils.log_info('Running pre-hook for silver facts') }}"
        +post-hook: "{{ dbt_utils.log_info('Running post-hook for silver facts') }}"
        +meta:
          owner: "data_team"
          description: "Silver fact models for F1 data"
