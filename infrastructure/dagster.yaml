scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 10  # Limit concurrent runs
    tag_concurrency_limits:
      - key: "dagster/backfill"
        value: "true"
        limit: 10 # Only 10 backfill runs at once

run_launcher:
  module: dagster_docker
  class: DockerRunLauncher
  config:
    env_vars:
      - DAGSTER_POSTGRES_USER
      - DAGSTER_POSTGRES_PASSWORD
      - DAGSTER_POSTGRES_DB
      - DAGSTER_POSTGRES_HOST
      - DESTINATION__POSTGRES__CREDENTIALS__HOST
      - DESTINATION__POSTGRES__CREDENTIALS__DATABASE
      - DESTINATION__POSTGRES__CREDENTIALS__USERNAME
      - DESTINATION__POSTGRES__CREDENTIALS__PASSWORD
    network: data_platform  # Docker Compose prefixes with directory name
    container_kwargs:
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - dagster_storage:/opt/dagster/app/storage
        - /Users/aura/data/f1:/data
      auto_remove: true
      
    image: dagster_code_image # Use the image from dagster_code service

run_storage:
  module: dagster_postgres.run_storage
  class: PostgresRunStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

schedule_storage:
  module: dagster_postgres.schedule_storage
  class: PostgresScheduleStorage
  config:
    postgres_db:
      hostname: 
        env: DAGSTER_POSTGRES_HOST
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432

event_log_storage:
  module: dagster_postgres.event_log
  class: PostgresEventLogStorage
  config:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      port: 5432
telemetry:
  enabled: false  # Disable telemetry for local development