version: '3.8'

services:
  # Dagster Webserver UI
  dagster-webserver:
    build: 
      context: ..
      dockerfile: infrastructure/dagster.Dockerfile
    ports:
      - "3001:3001"
    entrypoint:
      - dagster-webserver
      - -h
      - "0.0.0.0"
      - -p
      - "3001"
      - -w
      - workspace.yaml
    container_name: dagster_webserver
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagsterpass
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_PORT: 5432
    volumes:
      - dagster_storage:/opt/dagster/app/storage
      - ${HOME}/data/f1:/data
    networks:
      - data_platform
    depends_on:
      - postgres

  # Dagster Daemon
  dagster-daemon:
    build: 
      context: ..
      dockerfile: infrastructure/dagster.Dockerfile
    entrypoint:
      - dagster-daemon
      - run
    restart: on-failure
    container_name: dagster_daemon
    depends_on:
      - dagster-code
      - postgres
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagsterpass
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_PORT: 5432
      DESTINATION__POSTGRES__CREDENTIALS__HOST: postgres
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: dagster
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: dagster
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: dagsterpass
    volumes:
      - dagster_storage:/opt/dagster/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/data/f1:/data
    networks:
      - data_platform

  # Dagster Code 
  dagster-code:
    build: 
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: dagster_code
    image: dagster_code_image
    restart: unless-stopped
    environment:
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagsterpass
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_CURRENT_IMAGE: dagster_code_image
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_PORT: 5432
      # DLT postgres destination credentials
      DESTINATION__POSTGRES__CREDENTIALS__HOST: postgres
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: dagster
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: dagster
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: dagsterpass
    volumes:
      - dagster_storage:/opt/dagster/app/storage
      - ${HOME}/data/f1:/data
    networks:
      - data_platform
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagsterpass
      POSTGRES_DB: dagster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    networks:
      - data_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── mcpo-openapi — MCP → OpenAPI bridge for Open WebUI tool servers ──────
  # Wraps the stdio MCP server (server.py) as an OpenAPI server Open WebUI can
  # consume as a native tool server (better small-model tool calling).
  mcpo-openapi:
    build:
      context: ..
      dockerfile: infrastructure/mcpo.Dockerfile
    container_name: mcpo_openapi
    command: ["mcpo", "--host", "0.0.0.0", "--port", "8001", "--", "python", "server.py"]
    ports:
      - "8001:8001"
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=dagster
      - PG_USER=dagster
      - PG_PASSWORD=dagsterpass
      - PG_SILVER_SCHEMA=f1_silver
      - MB_BASE_URL=http://metabase:3000
      - MB_PUBLIC_URL=http://localhost:3002
      - MB_API_KEY=${METABASE_API_KEY}
      - MB_DATABASE_NAME=F1 Silver
      - MB_DEFAULT_COLLECTION=F1 Analytics
    networks:
      - data_platform
    depends_on:
      - postgres
      - metabase
    restart: unless-stopped

  # ── Open WebUI — Ollama-native chat UI (alternative agent harness) ───────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_SECRET_KEY=local-dev-only
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - data_platform
    depends_on:
      - mcpo-openapi
    restart: unless-stopped

  # ── Metabase — BI / dashboards over the Postgres silver layer ────────────
  # The agent drives this via its REST API to create questions + dashboards.
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3002:3000"
    environment:
      # Metabase's own app database (H2 file, persisted in a volume — fine for
      # local; switch to a dedicated Postgres db before any real deployment).
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    networks:
      - data_platform
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  dagster_storage:
    driver: local
  metabase_data:
    driver: local
  open_webui_data:
    driver: local

networks:
  data_platform:
    name: data_platform
    driver: bridge